# dnsmasq config for Waydroid network
# Provides DHCP + DNS for the waydroid0 bridge
# Run: sudo dnsmasq --conf-file=/Data/AutoAFK/waydroid-dnsmasq.conf

interface=waydroid0
bind-interfaces
except-interface=lo
no-resolv
no-poll

# DHCP range — Waydroid container will be assigned an IP from this pool
dhcp-range=192.168.240.50,192.168.240.150,12h
dhcp-option=3,192.168.240.1          # default gateway = host
dhcp-option=6,8.8.8.8,1.1.1.1        # DNS

# Upstream DNS for resolving queries
server=8.8.8.8
server=1.1.1.1

# Don't read /etc/hosts
no-hosts

# Log to syslog only (not stderr)
log-facility=/var/log/dnsmasq-waydroid.log
