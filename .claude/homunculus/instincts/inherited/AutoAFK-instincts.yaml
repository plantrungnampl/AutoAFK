2. Create corresponding test directory under tests/dev_tools/<module_name>/ with __init__.py.
3. Add initial implementation files (e.g., models.py, code_generator.py, etc.).
4. Add initial test files for new module.

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: src/dev_tools/<module_name>/__init__.py, tests/dev_tools/<module_name>/__init__.py

